version: "3.8"

services:
  redis:
    image: redis:6.2
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  db_init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db_init
    command: python -m app.scraper.init_db
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ./:/app

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery
    env_file:
      - .env
    volumes:
      - ./:/app
      - ./dumps:/app/dumps 
    command: celery -A app.scraper.tasks worker --loglevel=info
    depends_on:
      - redis
      - postgres
    

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_beat
    env_file:
      - .env
    command: celery -A app.scraper.tasks beat --loglevel=info
    depends_on:
      - redis
      - postgres
